name: tests
on: [push, pull_request]
jobs:
  policy-and-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install OPA
        run: |
          curl -fsSL -o opa https://openpolicyagent.org/downloads/latest/opa_linux_amd64_static
          chmod +x opa && sudo mv opa /usr/local/bin/opa
      - run: pip install -r requirements.txt pytest httpx
      - name: Policy unit tests (Rego)
        run: opa test policy -v
      - name: Gate and refund tests (pytest)
        run: python -m pytest -q
      - name: Mutation check (every deliberate policy bug must be caught)
        run: python tests/mutation_check.py
